name: Radar daily refresh

on:
  schedule:
    # ΠΡΟΣΟΧΗ: οι ώρες είναι UTC και ΔΕΝ προσαρμόζονται στη θερινή/χειμερινή ώρα.
    # Τον χειμώνα (UTC+2) το email θα φτάνει μία ώρα νωρίτερα σε τοπική ώρα.
    #
    # ΒΑΘΜΟΝΟΜΗΣΗ — μετρημένη 2026-08-07 σε 12 εκτελέσεις:
    # Το GitHub δεν τρέχει τα scheduled workflows στην ώρα του cron· τα βάζει
    # σε ουρά. Η μετρημένη καθυστέρηση ήταν 1:34 έως 3:01 (διάμεσος ~2:26).
    # Δεν είναι εγγύηση — είναι παρατήρηση. Στόχος: email ~07:30 Ελλάδας.
    # ΑΝ Η ΩΡΑ ΑΦΙΞΗΣ ΜΕΤΑΚΙΝΗΘΕΙ ΜΟΝΙΜΑ: ξαναμέτρα την καθυστέρηση
    # (`gh run list --workflow=radar-refresh.yml --json createdAt`) πριν
    # αλλάξεις τα νούμερα, και ενημέρωσε την ημερομηνία αυτού του σχολίου.
    # Τα λεπτά είναι επίτηδες "άτακτα" (:57, :27) — τα :00 και :30 έχουν
    # τη μεγαλύτερη ουρά στο GitHub.
    - cron: "57 1 * * *"   # κύριο πέρασμα → email ~06:50-08:15 Ελλάδας (θερινή ώρα)
    - cron: "27 2 * * *"   # ρεζέρβα 1: τρέχει ΜΟΝΟ αν χάθηκε το κύριο (βλ. guard "Skip if already refreshed")
    - cron: "57 2 * * *"   # ρεζέρβα 2: τρέχει ΜΟΝΟ αν χάθηκαν και τα δύο προηγούμενα
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: radar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check API credentials
        id: guard
        env:
          HAS_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::warning::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret is set - skipping this run. Add one in Settings > Secrets and variables > Actions."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - name: Skip if already refreshed today (backup schedule only)
        id: fresh
        if: steps.guard.outputs.skip != 'true' && github.event_name == 'schedule'
        run: |
          if grep -q "const GENERATED = \"$(date -u +%F)\"" radar/index.html; then
            echo "Radar already refreshed today - backup run has nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Claude Code
        if: steps.guard.outputs.skip != 'true' && steps.fresh.outputs.skip != 'true'
        run: npm install -g @anthropic-ai/claude-code

      # Sonnet first (best quality). If Anthropic's cyber safeguard blocks the
      # request (it sometimes flags the radar as a "cybersecurity topic"), fall
      # back to Haiku. After EVERY attempt the output must pass radar_check.py;
      # a bad attempt (e.g. Haiku writing a truncated archive) is rolled back
      # and retried instead of failing the whole day.
      - name: Run radar refresh (Sonnet, fallback Haiku, validate + retry)
        if: steps.guard.outputs.skip != 'true' && steps.fresh.outputs.skip != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          attempt=0
          for model in claude-sonnet-5 claude-haiku-4-5-20251001 claude-haiku-4-5-20251001; do
            attempt=$((attempt+1))
            echo "=== Attempt $attempt: $model ==="
            git checkout -- radar en/radar knowledge
            rm -f /tmp/radar-digest.md /tmp/radar-verdict.txt /tmp/radar-run-info.md /tmp/radar-model.txt
            if ! claude -p "$(cat .github/radar-prompt.md)" --model "$model" --dangerously-skip-permissions; then
              echo "::warning::Attempt $attempt ($model): claude exited with an error (API/safeguard block) - retrying with next model."
              continue
            fi
            if ! python3 .github/radar_check.py; then
              echo "::warning::Attempt $attempt ($model): output failed the structural check - rolling back and retrying."
              continue
            fi
            # Maker/checker: an INDEPENDENT agent audits the changes (read-only)
            # before anything is published. FAIL verdict -> roll back and retry.
            #
            # Ο ελεγκτής ΔΕΝ επιτρέπεται να γράψει. Οι οδηγίες του το λένε, αλλά
            # οδηγία δεν είναι κλειδαριά: τρέχει με παρακαμμένους ελέγχους
            # δικαιωμάτων, άρα ΜΠΟΡΕΙ να γράψει. Δεν το ζητάμε - το ΕΛΕΓΧΟΥΜΕ.
            # Αποτύπωμα του working tree πριν και μετά· αν διαφέρει, ο ελεγκτής
            # παραβίασε τον ρόλο του και η μέρα απορρίπτεται.
            tree_before="$(git status --porcelain=v1; git diff)"
            claude -p "$(cat .github/radar-verify-prompt.md)" --model "$model" --dangerously-skip-permissions || true
            tree_after="$(git status --porcelain=v1; git diff)"
            if [ "$tree_before" != "$tree_after" ]; then
              echo "::warning::Attempt $attempt ($model): ο ΕΛΕΓΚΤΗΣ τροποποίησε αρχεία - παραβίαση ρόλου, rollback."
              continue
            fi
            if [ -f /tmp/radar-verdict.txt ]; then
              echo "--- Checker verdict ---"; cat /tmp/radar-verdict.txt
              if [ "$(head -n1 /tmp/radar-verdict.txt)" != "PASS" ]; then
                echo "::warning::Attempt $attempt ($model): checker rejected the output - rolling back and retrying."
                continue
              fi
            else
              echo "::warning::Checker produced no verdict - accepting (structural check passed) but flagging."
            fi
            # Γραμμή εμπιστοσύνης για τη Μαρία: ποιο μοντέλο έγραψε το digest και
            # πώς πήγαν οι έλεγχοι. Χωρίς αυτό η πληροφορία μένει θαμμένη στα
            # logs του run, όπου δεν έχει λόγο να κοιτάξει.
            case "$model" in
              *sonnet*) friendly="Sonnet" ;;
              *haiku*)  friendly="Haiku" ;;
              *)        friendly="$model" ;;
            esac
            if [ -f /tmp/radar-verdict.txt ]; then
              verdict="$(head -n1 /tmp/radar-verdict.txt)"
            else
              verdict="δεν παρήχθη (έγινε δεκτό βάσει του δομικού ελέγχου)"
            fi
            {
              echo "> **Πώς φτιάχτηκε:** $friendly · προσπάθεια $attempt από 3 · δομικός έλεγχος OK"
              echo ">"
              echo "> **Ανεξάρτητος ελεγκτής:** $verdict · ίδιο μοντέλο, καθαρή συνεδρία, επιβεβαιωμένα καμία εγγραφή"
              if [ "$friendly" = "Haiku" ]; then
                echo ">"
                echo "> **Προσοχή:** έτρεξε με Haiku, γιατί το Sonnet απέτυχε ή μπλοκαρίστηκε. Τα γεγονότα πέρασαν τους ίδιους ελέγχους, αλλά το κείμενο για LinkedIn θέλει δούλεμα πριν το ποστάρεις."
              fi
              echo ""
            } > /tmp/radar-run-info.md
            printf '%s' "$friendly" > /tmp/radar-model.txt
            echo "Attempt $attempt ($model) succeeded, validated and checker-approved."
            exit 0
          done
          echo "::error::All attempts failed - keeping yesterday's pages live."
          git checkout -- radar en/radar knowledge
          exit 1

      - name: Commit and push
        if: steps.guard.outputs.skip != 'true' && steps.fresh.outputs.skip != 'true'
        run: |
          # Διαχωρισμός καθηκόντων, γραμμένος στο ίδιο το ιστορικό.
          # Το git ξεχωρίζει ήδη ΠΟΙΟΣ ΕΓΡΑΨΕ (author) από ΠΟΙΟΣ ΕΝΕΚΡΙΝΕ (committer).
          # Ο συντάκτης έγραψε τις σελίδες· ο ελεγκτής τις ενέκρινε και μόνο τότε
          # ανεβαίνουν. Δύο ρόλοι, δύο υπογραφές, ορατές σε κάθε commit.
          model="$(cat /tmp/radar-model.txt 2>/dev/null || true)"
          [ -n "$model" ] || model="unknown"
          verdict="$(head -n1 /tmp/radar-verdict.txt 2>/dev/null || true)"
          [ -n "$verdict" ] || verdict="χωρίς ετυμηγορία"
          git add radar/index.html en/radar/index.html knowledge/ai-security-log.md knowledge/known-terms.txt
          if git diff --cached --quiet; then
            echo "No changes to publish (feeds empty or nothing new)."
          else
            GIT_AUTHOR_NAME="radar-maker ($model)"             GIT_AUTHOR_EMAIL="radar-maker@users.noreply.github.com"             GIT_COMMITTER_NAME="radar-checker ($model)"             GIT_COMMITTER_EMAIL="radar-checker@users.noreply.github.com"             git commit -m "Radar: daily refresh $(date -u +%F)"                        -m "Συντάκτης (author): $model - συνέταξε σελίδες, ημερολόγιο, digest."                        -m "Ελεγκτής (committer): $model - ανεξάρτητος έλεγχος σε καθαρή συνεδρία."                        -m "Ετυμηγορία: $verdict. Επιβεβαιώθηκε ότι ο ελεγκτής δεν τροποποίησε κανένα αρχείο."
            git push
          fi

      - name: Send digest as GitHub issue
        if: steps.guard.outputs.skip != 'true' && steps.fresh.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/radar-digest.md ]; then
            model="$(cat /tmp/radar-model.txt 2>/dev/null || true)"
            [ -n "$model" ] || model="άγνωστο μοντέλο"
            # Η γραμμή εμπιστοσύνης μπαίνει ΜΕΤΑ την πρώτη γραμμή του digest:
            # η πρώτη γραμμή είναι το @mention που πυροδοτεί την ειδοποίηση email
            # και πρέπει να μείνει πρώτη.
            {
              head -n 1 /tmp/radar-digest.md
              echo ""
              cat /tmp/radar-run-info.md 2>/dev/null || true
              tail -n +2 /tmp/radar-digest.md
            } > /tmp/radar-issue-body.md
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "AI Radar Digest — $(date +%d/%m/%Y) · $model" \
              --body-file /tmp/radar-issue-body.md
          else
            echo "No new stories today - no digest."
          fi

      # Χωρίς αυτό το βήμα, μια ΑΠΟΤΥΧΙΑ μοιάζει ακριβώς με «δεν είχε νέα»:
      # και στις δύο περιπτώσεις απλώς δεν έρχεται email. Η σιωπή πρέπει να
      # ξεχωρίζει από την ησυχία, αλλιώς το σπάσιμο περνά απαρατήρητο για μέρες.
      - name: Ειδοποίηση όταν ο radar δεν ολοκληρώθηκε
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "@mbartzoka-ui"
            echo ""
            echo "**Ο radar δεν ολοκληρώθηκε σήμερα.** Οι σελίδες στο site δείχνουν ό,τι έδειχναν χθες, δεν χάλασε τίποτα δημόσια."
            echo ""
            echo "Δεν χρειάζεται να κάνεις κάτι τώρα. Αν δεις αυτό το μήνυμα δεύτερη μέρα στη σειρά, τότε αξίζει έλεγχος."
            echo ""
            echo "Τεχνικές λεπτομέρειες: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > /tmp/radar-fail.md
          gh issue create --repo "$GITHUB_REPOSITORY"             --title "AI Radar — ΔΕΝ ΕΤΡΕΞΕ $(date +%d/%m/%Y)"             --body-file /tmp/radar-fail.md
