name: Radar daily refresh

on:
  schedule:
    - cron: "50 3 * * *"   # ~06:50 Ελλάδας (θερινή ώρα)· με τη συνηθισμένη καθυστέρηση GitHub, email ως ~07:30-08:00
    - cron: "20 6 * * *"   # ρεζέρβα ~09:20 Ελλάδας: τρέχει ΜΟΝΟ αν το πρωινό πέρασμα χάθηκε (βλ. guard "Skip if already refreshed")
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: radar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check API credentials
        id: guard
        env:
          HAS_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::warning::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret is set - skipping this run. Add one in Settings > Secrets and variables > Actions."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - name: Skip if already refreshed today (backup schedule only)
        id: fresh
        if: steps.guard.outputs.skip != 'true' && github.event_name == 'schedule'
        run: |
          if grep -q "const GENERATED = \"$(date -u +%F)\"" radar/index.html; then
            echo "Radar already refreshed today - backup run has nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Claude Code
        if: steps.guard.outputs.skip != 'true' && steps.fresh.outputs.skip != 'true'
        run: npm install -g @anthropic-ai/claude-code

      # Sonnet first (best quality). If Anthropic's cyber safeguard blocks the
      # request (it sometimes flags the radar as a "cybersecurity topic"), fall
      # back to Haiku. After EVERY attempt the output must pass radar_check.py;
      # a bad attempt (e.g. Haiku writing a truncated archive) is rolled back
      # and retried instead of failing the whole day.
      - name: Run radar refresh (Sonnet, fallback Haiku, validate + retry)
        if: steps.guard.outputs.skip != 'true' && steps.fresh.outputs.skip != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          attempt=0
          for model in claude-sonnet-5 claude-haiku-4-5-20251001 claude-haiku-4-5-20251001; do
            attempt=$((attempt+1))
            echo "=== Attempt $attempt: $model ==="
            git checkout -- radar en/radar knowledge
            rm -f /tmp/radar-digest.md /tmp/radar-verdict.txt
            if ! claude -p "$(cat .github/radar-prompt.md)" --model "$model" --dangerously-skip-permissions; then
              echo "::warning::Attempt $attempt ($model): claude exited with an error (API/safeguard block) - retrying with next model."
              continue
            fi
            if ! python3 .github/radar_check.py; then
              echo "::warning::Attempt $attempt ($model): output failed the structural check - rolling back and retrying."
              continue
            fi
            # Maker/checker: an INDEPENDENT agent audits the changes (read-only)
            # before anything is published. FAIL verdict -> roll back and retry.
            claude -p "$(cat .github/radar-verify-prompt.md)" --model "$model" --dangerously-skip-permissions || true
            if [ -f /tmp/radar-verdict.txt ]; then
              echo "--- Checker verdict ---"; cat /tmp/radar-verdict.txt
              if [ "$(head -n1 /tmp/radar-verdict.txt)" != "PASS" ]; then
                echo "::warning::Attempt $attempt ($model): checker rejected the output - rolling back and retrying."
                continue
              fi
            else
              echo "::warning::Checker produced no verdict - accepting (structural check passed) but flagging."
            fi
            echo "Attempt $attempt ($model) succeeded, validated and checker-approved."
            exit 0
          done
          echo "::error::All attempts failed - keeping yesterday's pages live."
          git checkout -- radar en/radar knowledge
          exit 1

      - name: Commit and push
        if: steps.guard.outputs.skip != 'true' && steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name "radar-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add radar/index.html en/radar/index.html knowledge/ai-security-log.md
          if git diff --cached --quiet; then
            echo "No changes to publish (feeds empty or nothing new)."
          else
            git commit -m "Radar: daily refresh $(date -u +%F)"
            git push
          fi

      - name: Send digest as GitHub issue
        if: steps.guard.outputs.skip != 'true' && steps.fresh.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/radar-digest.md ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "AI Radar Digest — $(date +%d/%m/%Y)" \
              --body-file /tmp/radar-digest.md
          else
            echo "No new stories today - no digest."
          fi
