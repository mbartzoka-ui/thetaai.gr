name: IndexNow ping

# Ειδοποιεί το IndexNow (Bing, που τροφοδοτεί το ChatGPT search, και Yandex,
# Seznam, Naver) για τα URLs που άλλαξαν, ώστε να ξανασαρωθούν σε ώρες αντί
# για εβδομάδες. Στέλνει πάντα και την αρχική και το /iso-42001/ (EL/EN).
#
# ΓΙΑΤΙ ΚΑΙ workflow_run: τα commits του radar τα κάνει το radar-refresh.yml
# με το GITHUB_TOKEN, και τα push με GITHUB_TOKEN ΔΕΝ πυροδοτούν άλλα
# workflows. Χωρίς αυτό το trigger οι νέες σελίδες ιστοριών δεν θα
# στέλνονταν ποτέ. Το radar workflow δεν αλλάζει σε τίποτα.
#
# Το κλειδί είναι το αρχείο <key>.txt στο root του site. Αν αλλάξει,
# άλλαξε και το KEY παρακάτω.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Radar daily refresh"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

env:
  HOST: thetaai.gr
  KEY: 69338b6f603dfbd5a6440686a2cd4ca3

jobs:
  ping:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none

      - name: Collect changed URLs
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          case "$EVENT" in
            push)         before="$PUSH_BEFORE"; after="$PUSH_AFTER" ;;
            workflow_run) before="$RUN_SHA";     after="HEAD" ;;
            *)            before="HEAD~1";       after="HEAD" ;;
          esac
          # Νέο branch ή force push: το before δεν υπάρχει στο ιστορικό.
          if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            before="HEAD~1"
          fi
          echo "Range: $before..$after"
          {
            echo "https://$HOST/"
            echo "https://$HOST/en/"
            echo "https://$HOST/iso-42001/"
            echo "https://$HOST/en/iso-42001/"
            git diff --name-only --diff-filter=ACMR "$before" "$after" -- '*.html' \
              | grep -vE '^\.github/|(^|/)_[^/]*\.html$|^google[0-9a-f]+\.html$|-source\.html$' \
              | sed -E -e 's#(^|/)index\.html$#\1#' -e "s#^#https://$HOST/#"
          } | awk '!seen[$0]++' > /tmp/urls.txt
          echo "$(wc -l < /tmp/urls.txt) URLs:"
          cat /tmp/urls.txt

      # Το IndexNow επαληθεύει το κλειδί διαβάζοντας το https://HOST/KEY.txt.
      # Περιμένουμε να το σερβίρει το GitHub Pages (χρειάζεται μόνο την πρώτη
      # φορά) και δίνουμε στο deploy χρόνο να ανεβάσει τις νέες σελίδες.
      - name: Wait for the Pages deploy
        run: |
          for i in $(seq 1 20); do
            if [ "$(curl -fsS "https://$HOST/$KEY.txt" 2>/dev/null)" = "$KEY" ]; then
              echo "Key file is live."; break
            fi
            echo "Key file not live yet ($i/20)"; sleep 15
          done
          sleep 60

      # ΠΡΩΤΟ ΤΡΕΞΙΜΟ (30/10/2026): το IndexNow επαληθεύει ένα νέο κλειδί
      # ασύγχρονα και μέχρι τότε απαντά 403 SiteVerificationNotCompleted, ακόμα
      # κι αν το key file σερβίρεται σωστά. Αυτό και το 429 είναι προσωρινά:
      # ξαναδοκιμάζουμε με αυξανόμενη αναμονή. Αν η επαλήθευση δεν έχει
      # ολοκληρωθεί ούτε μετά από ~15 λεπτά, warning αντί για αποτυχία, ώστε να
      # μη φτάνει ψεύτικος συναγερμός· το επόμενο push ξαναστέλνει. Κάθε άλλο
      # σφάλμα (π.χ. λάθος κλειδί, 422) αποτυγχάνει κανονικά.
      - name: Submit to IndexNow
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          host, key = os.environ["HOST"], os.environ["KEY"]
          urls = [u for u in open("/tmp/urls.txt", encoding="utf-8").read().split() if u]
          WAITS = [60, 120, 180, 240, 300]
          for i in range(0, len(urls), 10000):
              chunk = urls[i:i + 10000]
              body = json.dumps({"host": host, "key": key,
                                 "keyLocation": f"https://{host}/{key}.txt",
                                 "urlList": chunk}).encode()
              for attempt in range(len(WAITS) + 1):
                  req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                               headers={"Content-Type": "application/json; charset=utf-8"})
                  try:
                      with urllib.request.urlopen(req, timeout=60) as r:
                          print(f"IndexNow: HTTP {r.status} for {len(chunk)} URLs")
                      break
                  except urllib.error.HTTPError as e:
                      msg = e.read().decode(errors="replace")[:300]
                      pending = e.code == 403 and "SiteVerificationNotCompleted" in msg
                      if (pending or e.code == 429) and attempt < len(WAITS):
                          print(f"IndexNow HTTP {e.code} (προσωρινό), ξαναδοκιμή σε {WAITS[attempt]}s: {msg}")
                          time.sleep(WAITS[attempt])
                          continue
                      if pending:
                          print(f"::warning::IndexNow: η επαλήθευση του site δεν έχει ολοκληρωθεί ακόμα. Το επόμενο push θα ξαναστείλει. {msg}")
                          raise SystemExit(0)
                      print(f"::error::IndexNow HTTP {e.code}: {msg}")
                      raise SystemExit(1)
          PY
